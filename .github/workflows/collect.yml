# YouBike + 天氣資料收集：每次被叫醒就連續工作 5.5 小時。
#
# ┌─ 為什麼是「連續工作 5.5 小時」而不是「每 5 分鐘跑一次 40 秒」？ ───┐
# │ 因為 GitHub 的排程器對這個 repo 幾乎不運作 —— 實測 7.5 小時只     │
# │ 觸發 1 次（照 */5 應該要約 90 次）。用一個最陽春的心跳 workflow   │
# │ 做對照實驗也是 0 次，確認問題不在我們的檔案而在排程器本身。       │
# │                                                                    │
# │ 既然叫不醒，就反過來設計：被叫醒一次就做很久。                     │
# │ 一次執行裡自己每 5 分鐘收一次，連續 5.5 小時（GitHub 單次工作      │
# │ 上限 6 小時），所以排程器一天只要叫醒 4~5 次就有接近完整的覆蓋率。 │
# │                                                                    │
# │ 代價：runner 會被長時間佔用（原設計一天約 3.2 小時）。公開 repo    │
# │ 免費無上限，但這確實是比較重的用法。                               │
# │                                                                    │
# │ 【之後想換回輕量做法】改用外部服務每 5 分鐘打一次                  │
# │   POST /repos/<owner>/<repo>/dispatches  {"event_type":"collect"}  │
# │ 然後把下面的「收集迴圈」那一步換成單次執行即可（見 git 歷史）。    │
# └────────────────────────────────────────────────────────────────────┘
#
# 為什麼要「兩個 checkout」？
#   程式在 main、資料在 data，是兩個沒有共同歷史的分支。
#   一次 checkout 只能拿一個分支，所以取兩次，各放在不同資料夾。
name: 收集 YouBike 資料

on:
  schedule:
    # 每 5 分鐘。cron 的最小間隔就是 5 分鐘，比這更密 GitHub 不接受。
    - cron: "*/5 * * * *"

  # 讓外部的排程服務可以「叫醒」這個 workflow。
  #
  # 為什麼需要這個？
  #   GitHub 自己的排程器對這個 repo 極度不可靠（實測 6.5 小時只觸發 1 次）。
  #   上面的 schedule 保留著 —— 它哪天恢復正常也不會有壞處，
  #   concurrency 會確保兩邊同時來的時候不會打架。
  #   這一行則讓外部服務可以用 GitHub API 直接點名叫它跑：
  #     POST /repos/<owner>/<repo>/dispatches  {"event_type": "collect"}
  #
  # 在外部服務真的送出請求之前，加這一行不會改變任何現有行為。
  repository_dispatch:
    types: [collect]

  # 讓你可以在 GitHub 網頁上按按鈕手動跑一次（測試用，不用等排程）
  workflow_dispatch:

# 預設的 GITHUB_TOKEN 是唯讀的，這裡要寫 commit 進 data 分支，所以要開寫入權限。
# 只開 contents，其他權限一律不給 —— 權限越小，萬一出事影響越小。
permissions:
  contents: write

# 同一時間只准跑一個。為什麼？
#   如果上一次執行被延遲、跟下一次重疊，兩個 job 會同時想 push 到 data 分支，
#   其中一個一定會被拒絕（甚至可能撞到同一個檔名）。排隊執行最單純。
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    # 迴圈本身跑 330 分鐘（5.5 小時），這裡設 350 留 20 分鐘緩衝，
    # 讓最後一輪有時間乾淨收尾。GitHub 單次工作的硬上限是 360 分鐘。
    timeout-minutes: 350

    steps:
      - name: 取出程式（main 分支）
        uses: actions/checkout@v7

      - name: 取出資料分支（data）到 data-branch/
        uses: actions/checkout@v7
        with:
          ref: data
          path: data-branch
          # 只取最新一個 commit。data 分支每天會多 288 個 commit，
          # 如果每次都抓完整歷史，三個月後每次執行光下載就要花好幾分鐘。
          fetch-depth: 1

      - name: 安裝 Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          # 把下載好的套件存起來重用，省下每次重新下載 pyarrow 的時間
          cache: pip
          cache-dependency-path: requirements-collect.txt

      - name: 安裝套件（只有 requests + pyarrow）
        run: pip install -r requirements-collect.txt

      - name: 收集迴圈（每 5 分鐘一輪，連續 5.5 小時）
        # 迴圈邏輯放在 scripts/collect_loop.sh，不寫在 YAML 裡 ——
        # 這樣可以在本機直接測（bash scripts/collect_loop.sh ./data-branch 3 60），
        # 不用每改一行就 push 一次上來碰運氣。
        #
        # 每一輪做三件事：收 YouBike -> 收天氣 -> 推上 data 分支。
        # 三件事各自獨立接住錯誤：任何一個失敗都只印訊息，
        # 不會中斷接下來幾個小時的收集。
        #
        # 每輪都推而不是最後才推：資料只存在 runner 的硬碟上，
        # job 一旦被砍（逾時、取消、GitHub 維護），沒推的資料就全沒了。
        env:
          # 天氣要用的金鑰，值來自 repo 的 Settings -> Secrets and variables -> Actions
          CWA_API_KEY: ${{ secrets.CWA_API_KEY }}
        run: bash scripts/collect_loop.sh "$GITHUB_WORKSPACE/data-branch" 330 300
