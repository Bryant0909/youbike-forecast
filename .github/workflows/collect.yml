# phase 0-4：每 5 分鐘抓一次 YouBike 即時資料，存進 data 分支。
#
# ┌─ 這個 workflow 在做什麼 ───────────────────────────────────────────┐
# │ 1. 取出 main 分支（程式）                                          │
# │ 2. 取出 data 分支到 data-branch/ 資料夾（資料要寫進這裡）          │
# │ 3. 跑 scripts/collect.py，把小檔寫進 data-branch/                  │
# │ 4. 把新檔 commit 並推回 data 分支                                  │
# └────────────────────────────────────────────────────────────────────┘
#
# 為什麼要「兩個 checkout」？
#   程式在 main、資料在 data，是兩個沒有共同歷史的分支。
#   一次 checkout 只能拿一個分支，所以取兩次，各放在不同資料夾。
#
# ⚠️ 關於 cron 準不準：
#   GitHub 的排程是「盡力而為」，不保證準時 —— 全球負載高的時候會延遲，
#   偶爾甚至整次跳過。所以實際間隔可能是 5～20 分鐘，不會每次都剛好 5 分鐘。
#   這件事我們用兩個機制去對付，而不是硬要它準：
#     - collect.py 用「來源時間」當檔名，延遲抓到同一份資料會自動跳過，不會混進重複列
#     - phase 0-6 每天檢查昨天收到幾筆，太少就自動開 Issue 通知
name: 收集 YouBike 資料

on:
  schedule:
    # 每 5 分鐘。cron 的最小間隔就是 5 分鐘，比這更密 GitHub 不接受。
    - cron: "*/5 * * * *"

  # 讓外部的排程服務可以「叫醒」這個 workflow。
  #
  # 為什麼需要這個？
  #   GitHub 自己的排程器對這個 repo 極度不可靠（實測 6.5 小時只觸發 1 次）。
  #   上面的 schedule 保留著 —— 它哪天恢復正常也不會有壞處，
  #   concurrency 會確保兩邊同時來的時候不會打架。
  #   這一行則讓外部服務可以用 GitHub API 直接點名叫它跑：
  #     POST /repos/<owner>/<repo>/dispatches  {"event_type": "collect"}
  #
  # 在外部服務真的送出請求之前，加這一行不會改變任何現有行為。
  repository_dispatch:
    types: [collect]

  # 讓你可以在 GitHub 網頁上按按鈕手動跑一次（測試用，不用等排程）
  workflow_dispatch:

# 預設的 GITHUB_TOKEN 是唯讀的，這裡要寫 commit 進 data 分支，所以要開寫入權限。
# 只開 contents，其他權限一律不給 —— 權限越小，萬一出事影響越小。
permissions:
  contents: write

# 同一時間只准跑一個。為什麼？
#   如果上一次執行被延遲、跟下一次重疊，兩個 job 會同時想 push 到 data 分支，
#   其中一個一定會被拒絕（甚至可能撞到同一個檔名）。排隊執行最單純。
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    # 正常一次大約 40 秒。設 10 分鐘上限，卡住的話會被砍掉而不是無限佔用。
    timeout-minutes: 10

    steps:
      - name: 取出程式（main 分支）
        uses: actions/checkout@v7

      - name: 取出資料分支（data）到 data-branch/
        uses: actions/checkout@v7
        with:
          ref: data
          path: data-branch
          # 只取最新一個 commit。data 分支每天會多 288 個 commit，
          # 如果每次都抓完整歷史，三個月後每次執行光下載就要花好幾分鐘。
          fetch-depth: 1

      - name: 安裝 Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          # 把下載好的套件存起來重用，省下每次重新下載 pyarrow 的時間
          cache: pip
          cache-dependency-path: requirements-collect.txt

      - name: 安裝套件（只有 requests + pyarrow）
        run: pip install -r requirements-collect.txt

      - name: 抓一次資料
        # 用絕對路徑（$GITHUB_WORKSPACE）而不是相對路徑，
        # 這樣不管 Actions 從哪個目錄執行都不會寫錯位置。
        run: python scripts/collect.py --out-dir "$GITHUB_WORKSPACE/data-branch"

      - name: 把新資料推回 data 分支
        # 推送的邏輯（commit 訊息、push 失敗重試）抽到 scripts/push_data.sh，
        # 跟 compact.yml 共用同一份，不會兩邊走鐘。
        run: bash scripts/push_data.sh data "$GITHUB_WORKSPACE/data-branch"
