# phase 0-4：每 5 分鐘抓一次 YouBike 即時資料，存進 data 分支。
#
# ┌─ 這個 workflow 在做什麼 ───────────────────────────────────────────┐
# │ 1. 取出 main 分支（程式）                                          │
# │ 2. 取出 data 分支到 data-branch/ 資料夾（資料要寫進這裡）          │
# │ 3. 跑 scripts/collect.py，把小檔寫進 data-branch/                  │
# │ 4. 把新檔 commit 並推回 data 分支                                  │
# └────────────────────────────────────────────────────────────────────┘
#
# 為什麼要「兩個 checkout」？
#   程式在 main、資料在 data，是兩個沒有共同歷史的分支。
#   一次 checkout 只能拿一個分支，所以取兩次，各放在不同資料夾。
#
# ⚠️ 關於 cron 準不準：
#   GitHub 的排程是「盡力而為」，不保證準時 —— 全球負載高的時候會延遲，
#   偶爾甚至整次跳過。所以實際間隔可能是 5～20 分鐘，不會每次都剛好 5 分鐘。
#   這件事我們用兩個機制去對付，而不是硬要它準：
#     - collect.py 用「來源時間」當檔名，延遲抓到同一份資料會自動跳過，不會混進重複列
#     - phase 0-6 每天檢查昨天收到幾筆，太少就自動開 Issue 通知
name: 收集 YouBike 資料

on:
  schedule:
    # 每 5 分鐘。cron 的最小間隔就是 5 分鐘，比這更密 GitHub 不接受。
    - cron: "*/5 * * * *"
  # 讓你可以在 GitHub 網頁上按按鈕手動跑一次（測試用，不用等排程）
  workflow_dispatch:

# 預設的 GITHUB_TOKEN 是唯讀的，這裡要寫 commit 進 data 分支，所以要開寫入權限。
# 只開 contents，其他權限一律不給 —— 權限越小，萬一出事影響越小。
permissions:
  contents: write

# 同一時間只准跑一個。為什麼？
#   如果上一次執行被延遲、跟下一次重疊，兩個 job 會同時想 push 到 data 分支，
#   其中一個一定會被拒絕（甚至可能撞到同一個檔名）。排隊執行最單純。
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    # 正常一次大約 40 秒。設 10 分鐘上限，卡住的話會被砍掉而不是無限佔用。
    timeout-minutes: 10

    steps:
      - name: 取出程式（main 分支）
        uses: actions/checkout@v7

      - name: 取出資料分支（data）到 data-branch/
        uses: actions/checkout@v7
        with:
          ref: data
          path: data-branch
          # 只取最新一個 commit。data 分支每天會多 288 個 commit，
          # 如果每次都抓完整歷史，三個月後每次執行光下載就要花好幾分鐘。
          fetch-depth: 1

      - name: 安裝 Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          # 把下載好的套件存起來重用，省下每次重新下載 pyarrow 的時間
          cache: pip
          cache-dependency-path: requirements-collect.txt

      - name: 安裝套件（只有 requests + pyarrow）
        run: pip install -r requirements-collect.txt

      - name: 抓一次資料
        # 用絕對路徑（$GITHUB_WORKSPACE）而不是相對路徑，
        # 這樣不管 Actions 從哪個目錄執行都不會寫錯位置。
        run: python scripts/collect.py --out-dir "$GITHUB_WORKSPACE/data-branch"

      - name: 把新資料推回 data 分支
        working-directory: data-branch
        run: |
          set -euo pipefail

          # commit 的作者掛在 Actions 機器人名下，跟你自己手寫的 commit 分得開
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 沒有新檔案就直接結束（代表來源還沒產生新資料，collect.py 跳過了）。
          # 這不是錯誤，所以用 exit 0 正常結束。
          if [ -z "$(git status --porcelain)" ]; then
            echo "沒有新資料（來源還沒更新），這次不 commit"
            exit 0
          fi

          git add -A
          # commit 訊息裡放抓到的檔名，這樣在 GitHub 上看歷史一眼就知道是哪個時間點
          NEW_FILES=$(git diff --cached --name-only --diff-filter=A | head -n 3 | tr '\n' ' ')
          git commit -m "data: ${NEW_FILES:-update}"

          # push 可能失敗：別的 job 剛好也推了東西上去（雖然 concurrency 已經擋掉大部分）。
          # 失敗就把遠端的變更拉下來重新疊上去再試。每次都是新增不同檔名，所以不會衝突。
          for i in 1 2 3 4 5; do
            if git push origin HEAD:data; then
              echo "推送成功"
              exit 0
            fi
            echo "推送失敗（第 $i 次），拉取遠端後重試…"
            git fetch origin data
            if ! git rebase origin/data; then
              git rebase --abort || true
              echo "重疊失敗，放棄這次（資料只損失這 5 分鐘，下次會繼續）"
              exit 1
            fi
            sleep $((i * 3))
          done

          echo "推送重試 5 次都失敗"
          exit 1
