# YouBike + 天氣資料收集：外部排程服務每 5 分鐘叫一次，每次收一輪就結束。
#
# ┌─ 為什麼不用 GitHub 自己的排程（schedule / cron）？ ────────────────┐
# │ GitHub 的排程器對這個 repo 幾乎不運作 —— 實測 7.5 小時只觸發 1 次  │
# │（照 */5 應該要約 90 次），心跳對照實驗也是 0 次。                   │
# │                                                                    │
# │ 9/30 ~ 10/6 曾改成「被叫醒一次就連續工作 5.5 小時」來硬撐，        │
# │ 平常覆蓋率有 98% 以上，但兩次長迴圈之間只要排程沒接上就會開天窗：  │
# │ 10/6 凌晨 03:55 ~ 09:29 整整 334 分鐘沒資料，早上尖峰只剩 19%。    │
# │                                                                    │
# │ 所以改由外部服務（cron-job.org）每 5 分鐘打一次 GitHub API：        │
# │   POST /repos/Bryant0909/youbike-forecast/actions/workflows/       │
# │        collect.yml/dispatches        body: {"ref": "main"}         │
# │ 這會觸發下面的 workflow_dispatch。就算某一次 GitHub 沒派到機器，    │
# │ 也只損失那 5 分鐘，下一次照樣會來 —— 不會再一斷好幾個小時。        │
# └────────────────────────────────────────────────────────────────────┘
#
# 為什麼用 workflow_dispatch 而不是 repository_dispatch？
#   兩個都能從外部叫醒 workflow，差別在「token 需要什麼權限」：
#     - repository_dispatch 要 Contents 寫入權限 = 這把 token 也能改程式碼、推 commit
#     - workflow_dispatch   只要 Actions 寫入權限 = 只能觸發／取消 workflow
#   token 是放在外部服務上的，萬一外洩，權限越小損害越小，所以選後者。
#
# 為什麼要「兩個 checkout」？
#   程式在 main、資料在 data，是兩個沒有共同歷史的分支。
#   一次 checkout 只能拿一個分支，所以取兩次，各放在不同資料夾。
name: 收集 YouBike 資料

on:
  # 外部服務叫醒它，以及你在 GitHub 網頁上按按鈕手動跑一次（測試用）都走這個。
  #
  # 【刻意拿掉 schedule】
  #   它一天只會零星觸發幾次，留著只會在固定的 5 分鐘節奏之外多插幾筆
  #   不規則的取樣，讓時間序列變亂，卻補不了什麼覆蓋率。
  #   萬一外部服務停了，靠的是 coverage.yml 的每日檢查開 Issue 通知你，
  #   以及 cron-job.org 自己的「執行失敗」email 通知。
  workflow_dispatch:

# 預設的 GITHUB_TOKEN 是唯讀的，這裡要寫 commit 進 data 分支，所以要開寫入權限。
# 只開 contents，其他權限一律不給 —— 權限越小，萬一出事影響越小。
permissions:
  contents: write

# 同一時間只准跑一個。為什麼？
#   如果上一次執行被延遲、跟下一次重疊，兩個 job 會同時想 push 到 data 分支，
#   其中一個一定會被拒絕（甚至可能撞到同一個檔名）。排隊執行最單純。
#   （GitHub 的規則：同一群組最多一個在跑、一個在排隊；
#     又有新的進來時，舊的那個「排隊中」會被取消，所以 Actions 頁面偶爾
#     看到 cancelled 是正常的。）
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    # 正常一次大約 40 秒。設 10 分鐘上限，卡住的話會被砍掉而不是無限佔用。
    timeout-minutes: 10

    steps:
      - name: 取出程式（main 分支）
        uses: actions/checkout@v7

      - name: 取出資料分支（data）到 data-branch/
        uses: actions/checkout@v7
        with:
          ref: data
          path: data-branch
          # 只取最新一個 commit。data 分支每天會多 288 個 commit，
          # 如果每次都抓完整歷史，三個月後每次執行光下載就要花好幾分鐘。
          fetch-depth: 1

      - name: 安裝 Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          # 把下載好的套件存起來重用，省下每次重新下載 pyarrow 的時間
          cache: pip
          cache-dependency-path: requirements-collect.txt

      - name: 安裝套件（只有 requests + pyarrow）
        run: pip install -r requirements-collect.txt

      - name: 抓一次資料
        # 用絕對路徑（$GITHUB_WORKSPACE）而不是相對路徑，
        # 這樣不管 Actions 從哪個目錄執行都不會寫錯位置。
        run: python scripts/collect.py --out-dir "$GITHUB_WORKSPACE/data-branch"

      - name: 抓一次天氣資料
        # 【continue-on-error: true 是這一步的重點】
        #
        # 天氣是「附加」資料，YouBike 才是主角。如果氣象署掛掉、金鑰過期、
        # 或回傳格式改了，絕對不能讓它害 YouBike 的資料也收不到 ——
        # 那會是「為了次要的東西弄丟主要的東西」。
        # 加了這一行，天氣失敗只會在紀錄裡留下黃色警告，
        # 後面的推送照常進行，YouBike 的資料一樣會存下來。
        #
        # 氣象署每 10 分鐘才更新一次，所以每 5 分鐘執行會有大約一半
        # 印出「跳過：這份觀測已經存過了」—— 那是正常的，不是錯誤。
        continue-on-error: true
        env:
          # 值來自 repo 的 Settings -> Secrets and variables -> Actions
          CWA_API_KEY: ${{ secrets.CWA_API_KEY }}
        run: python scripts/collect_weather.py --out-dir "$GITHUB_WORKSPACE/data-branch"

      - name: 把新資料推回 data 分支
        # 推送的邏輯（commit 訊息、push 失敗重試）抽到 scripts/push_data.sh，
        # 跟 compact.yml 共用同一份，不會兩邊走鐘。
        run: bash scripts/push_data.sh data "$GITHUB_WORKSPACE/data-branch"
